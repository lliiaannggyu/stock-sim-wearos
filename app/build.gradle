plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // 小米/OPPO 国行手表 Wear Compose 兼容层 (补全 WearHapticFeedbackConstants 等)
    id 'cc.star0.wear.lib.cnwearoverlay' version '1.2.1'
}

android {
    namespace 'com.tengwear.chaoguwang'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tengwear.chaoguwang'
        minSdk 25
        targetSdk 34
        versionCode 13
        versionName '2.8.0'
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug { minifyEnabled false }
        // 诊断版: 不混淆不收缩资源, 用于排查小米手表等兼容性闪退
        diagnostic {
            minifyEnabled false
            shrinkResources false
            applicationIdSuffix '.diag'
            versionNameSuffix '-diag'
            signingConfig signingConfigs.debug
        }
        release {
            // R8 压缩 + 资源收缩 + 混淆
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    // Wear OS M3E 官方组件库 (与 AppOpsPro 同版本): TransformingLazyColumn / ScreenScaffold / material3
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.wear.compose:compose-material3:1.5.0'
    implementation 'androidx.wear.compose:compose-navigation:1.5.0'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material:material-icons-core'
}
